[package]
name = "moloko"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
boringtun = "0.7.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13.0"
libc = "0.2.191"
mime_guess = "2.0.5"
p384 = "0.14"
rsa = "0.10"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x25519-dalek = { version = "3", features = ["getrandom"] }
x509-cert = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
